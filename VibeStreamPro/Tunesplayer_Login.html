<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tunes player | Login</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #121212;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.login-box {
  background: #000;
  padding: 40px;
  width: 320px;
  border-radius: 10px;
  text-align: center;
}
.logo {
  font-size: 26px;
  font-weight: bold;
  margin-bottom: 20px;
}
input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 20px;
  border: none;
  outline: none;
  background: #333;
  color: #fff;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 20px;
  background: #1db954;
  color: #000;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:hover {
  background: #1ed760;
}
.links {
  margin-top: 15px;
  font-size: 14px;
}
.links a {
  color: #b3b3b3;
  text-decoration: none;
}
.links a:hover {
  color: #fff;
}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo">Tunes player</div>
  <input type="text" placeholder="Username or Email">
  <input type="password" placeholder="Password">
  <button>Log In</button>
  <div class="links">
    <p><a href="#">Forgot password?</a></p>
    <p><a href="#">Sign up</a></p>
  </div>
</div>
</body>
</html>
